  # ===========================================================================
  #  LABO (ex-« Calendrier ») — vue de test
  #  Elle s'appelait « Calendrier » mais ne contenait aucun calendrier : juste
  #  des brouillons (ancienne carte machine à laver, ventilo et télécommande en
  #  double, Pi-hole). Renommée + réservée à l'admin. Supprime-la si inutile.
  # ===========================================================================
  - type: sections
    title: Labo
    path: labo
    icon: mdi:flask-outline
    max_columns: 4
    visible:
      - user: de1fc08b628c4608afe7d6a11e3b3947
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Tests
            icon: mdi:flask-outline
          - type: custom:button-card
            entity: sensor.lave_linge_machine_state
            name: Machine à laver (ancienne carte)
            icon: mdi:washing-machine
            show_state: false
            show_label: true
            tap_action:
              action: more-info
            variables:
              sensor_progress: sensor.smart_washer_progress
              sensor_time_remaining: sensor.lave_linge_completion_time
              sensor_power: sensor.lave_linge_energie
              sensor_percentage: sensor.smart_washer_percentage
            label: |
              [[[
                const map = {
                  wash: 'Lavage', washing: 'Lavage', rinse: 'Rinçage', rinsing: 'Rinçage',
                  spin: 'Essorage', spinning: 'Essorage', dry: 'Séchage', drying: 'Séchage',
                  finished: 'Terminé', complete: 'Terminé', end: 'Terminé',
                  idle: 'En veille', standby: 'En veille', off: 'Éteinte', pause: 'En pause'
                };
                const raw = entity.state || 'unknown';
                return map[raw.toLowerCase()] || raw;
              ]]]
            styles:
              card:
                - height: 120px
                - border-radius: 24px
                - padding: 16px
                - overflow: hidden
                - position: relative
                - background: |
                    [[[
                      const s = entity.state?.toLowerCase() || '';
                      if (['wash','washing','rinse','rinsing','pre-wash','soak'].includes(s))
                        return 'linear-gradient(135deg, rgba(33,150,243,.22), rgba(33,150,243,.05))';
                      if (['spin','spinning'].includes(s))
                        return 'linear-gradient(135deg, rgba(0,188,212,.24), rgba(0,188,212,.05))';
                      if (['dry','drying'].includes(s))
                        return 'linear-gradient(135deg, rgba(255,152,0,.24), rgba(255,152,0,.05))';
                      if (['finished','complete','end'].includes(s))
                        return 'linear-gradient(135deg, rgba(76,175,80,.24), rgba(76,175,80,.05))';
                      return 'linear-gradient(135deg, rgba(120,120,120,.14), rgba(120,120,120,.04))';
                    ]]]
                - box-shadow: 0 8px 24px rgba(0,0,0,.12)
                - border: 1px solid rgba(255,255,255,.08)
              grid:
                - grid-template-areas: |
                    "i n badge"
                    "i l badge"
                    "bar bar bar"
                - grid-template-columns: 64px 1fr auto
                - grid-template-rows: 1fr 1fr 12px
                - column-gap: 14px
                - height: 100%
              img_cell:
                - width: 62px
                - height: 62px
                - border-radius: 20px
                - background: rgba(255,255,255,.10)
                - backdrop-filter: blur(10px)
                - align-self: center
                - justify-self: center
                - box-shadow: inset 0 0 0 1px rgba(255,255,255,.08)
              icon:
                - width: 38px
                - color: |
                    [[[
                      const s = entity.state?.toLowerCase() || '';
                      if (['spin','spinning'].includes(s)) return '#00bcd4';
                      if (['dry','drying'].includes(s)) return '#ff9800';
                      if (['finished','complete','end'].includes(s)) return '#4caf50';
                      if (['wash','washing','rinse','rinsing','pre-wash','soak'].includes(s)) return '#2196f3';
                      return 'var(--secondary-text-color)';
                    ]]]
                - animation: |
                    [[[
                      const s = entity.state?.toLowerCase() || '';
                      if (['spin','spinning'].includes(s)) return 'spin 1s linear infinite';
                      if (['wash','washing','rinse','rinsing','pre-wash','soak'].includes(s)) return 'shake 1.6s ease-in-out infinite';
                      return 'none';
                    ]]]
              name:
                - justify-self: start
                - align-self: end
                - font-size: 16px
                - font-weight: 700
              label:
                - justify-self: start
                - align-self: start
                - font-size: 13px
                - opacity: 0.75
              custom_fields:
                badge:
                  - align-self: center
                  - justify-self: end
                  - text-align: right
                  - font-size: 12px
                  - line-height: 1.45
                  - padding: 8px 10px
                  - border-radius: 14px
                  - background: rgba(255,255,255,.10)
                  - backdrop-filter: blur(10px)
                  - min-width: 72px
                bar:
                  - position: absolute
                  - left: 16px
                  - right: 16px
                  - bottom: 14px
                  - height: 8px
                  - border-radius: 999px
                  - overflow: hidden
                  - background: rgba(255,255,255,.12)
            custom_fields:
              badge: |
                [[[
                  const p = states[variables.sensor_power];
                  const power = p ? Math.round(parseFloat(p.state)) + ' W' : '— W';
                  let percent = parseInt(states[variables.sensor_percentage]?.state);
                  if (isNaN(percent)) percent = 0;
                  const raw = states[variables.sensor_time_remaining]?.state || '';
                  let timeText = '';
                  if (raw.includes('-') && raw.includes(':')) {
                    const diff = Math.max(0, Math.floor((new Date(raw) - new Date()) / 60000));
                    if (diff > 0) timeText = `${Math.floor(diff / 60)}h${String(diff % 60).padStart(2, '0')}`;
                  }
                  return `<div>⚡ ${power}</div><div>⏳ ${timeText || '—'}</div><div>🧼 ${percent}%</div>`;
                ]]]
              bar: |
                [[[
                  let percent = parseInt(states[variables.sensor_percentage]?.state);
                  if (isNaN(percent)) percent = 0;
                  percent = Math.max(0, Math.min(100, percent));
                  const s = entity.state?.toLowerCase() || '';
                  let color = '#9e9e9e';
                  if (['wash','washing','rinse','rinsing','pre-wash','soak'].includes(s)) color = '#2196f3';
                  if (['spin','spinning'].includes(s)) color = '#00bcd4';
                  if (['dry','drying'].includes(s)) color = '#ff9800';
                  if (['finished','complete','end'].includes(s)) color = '#4caf50';
                  return `<div style="height:100%;width:${percent}%;background:${color};border-radius:999px;box-shadow:0 0 12px ${color};transition:width .6s ease;"></div>`;
                ]]]
            extra_styles: |
              @keyframes spin {
                from { transform: rotate(0deg); }
                to   { transform: rotate(360deg); }
              }
              @keyframes shake {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(5deg) translateY(-1px); }
                75% { transform: rotate(-5deg) translateY(1px); }
              }
          # Même carte que dans le pop-up #ventilation (réutilisée via ancre)
          - *fan_card
          - type: custom:pi-hole
            device_id: dabdfa26a0cf174d37cd2810451ec8e5
            exclude_sections:
              - footer
            switch_style: flex
            switch_spacing: flex
            chart:
              line_type: normal
            features:
              - disable_group_pausing
      - type: grid
        cards:
          - type: heading
            heading: Télécommande
            icon: mdi:remote-tv
          # Même config que le pop-up #TV_remote (réutilisée via ancre)
          - *tv_remote
      - type: grid
        cards:
          - type: custom:navbar-card
            template: nav-bar
